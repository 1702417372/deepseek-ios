  function isBlockStart(line) {

  function mdToHtml(src) {
    var lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      var m = line.match(RE_FENCE_OPEN);
      if (m) {
        var lang = (m[1] || '').trim().split(/\s+/)[0].replace(/[^a-zA-Z0-9+#._-]/g, '').slice(0, 18);
        var code = [];
        i++;
        while (i < lines.length && !RE_FENCE_CLOSE.test(lines[i])) { code.push(lines[i]); i++; }
        if (i < lines.length) i++;
        out.push('<div class="code-block"><div class="code-head"><span class="code-lang">' + (lang ? escapeHtml(lang) : '代码') + '</span><button type="button" class="code-copy" data-copy-code>复制</button></div><pre><code>' + escapeHtml(code.join('\n')) + '</code></pre></div>');
        continue;
      }
      m = line.match(RE_HEADING);
      if (m) {
        var level = Math.min(m[1].length + 1, 4);
        out.push('<h' + level + '>' + inlineMd(m[2]) + '</h' + level + '>');
        i++;
        continue;
      }
      if (/^\s*>/.test(line)) {
        var quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          quote.push(lines[i].replace(/^\s*>\s?/, ''));
          i++;
        }
        out.push('<blockquote>' + quote.map(inlineMd).join('<br>') + '</blockquote>');
        continue;
      }
      if (RE_ANY_LIST.test(line)) {
        var ordered = RE_OL.test(line);
        var re = ordered ? RE_OL : RE_UL;
        var items = [];
        while (i < lines.length && re.test(lines[i])) {
          items.push(inlineMd(lines[i].match(re)[1]));
          i++;
        }
        out.push((ordered ? '<ol>' : '<ul>') + '<li>' + items.join('</li><li>') + '</li>' + (ordered ? '</ol>' : '</ul>'));
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) {
        para.push(lines[i]);
        i++;
      }
      out.push('<p>' + para.map(inlineMd).join('<br>') + '</p>');
    }
    return out.join('');
  }

  async function responseError(res) {
    var detail = '';
    try {
      var text = await res.text();
      if (text) {
        try {
          var parsed = JSON.parse(text);
          detail = (parsed.error && parsed.error.message) || parsed.message || text;
        } catch (e) { detail = text; }
      }
    } catch (e) {}
    detail = String(detail || '').replace(/\s+/g, ' ').slice(0, 180);
    var msg;
    if (res.status === 401) msg = 'API Key 无效或已过期，请在设置中检查 Key。';
    else if (res.status === 402) msg = '账户余额不足，请前往 DeepSeek 平台充值后重试。';
    else if (res.status === 429) msg = '请求过于频繁，请稍后再试。';
    else if (res.status === 400) msg = '请求参数有误，请检查模型与设置。';
    else if (res.status === 403) msg = '访问被拒绝，请检查 API Key 权限。';
    else if (res.status === 404) msg = 'API 地址不存在（404），请检查 Base URL。';
    else if (res.status >= 500) msg = 'DeepSeek 服务暂时不可用（' + res.status + '），请稍后重试。';
    else msg = '请求失败（HTTP ' + res.status + '）。';
    if (detail) msg += ' ' + detail;
    var err = new Error(msg);
    err.friendly = msg;
    err.status = res.status;

  }

  // DeepSeek 兼容 OpenAI 的 SSE 流：按行解析，buffer 保留跨块残行
  async function streamReply(session, assistant) {
    var res = await fetch(apiBase() + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + settings.apiKey.trim(),
        'Accept': 'text/event-stream'
      },
      body: JSON.stringify({
        model: settings.model,
        messages: buildApiMessages(session),
        stream: true,
        temperature: Number(settings.temperature)
      }),
      signal: controller ? controller.signal : undefined
    });
    if (!res.ok) throw await responseError(res);
    if (!res.body) throw new Error('当前浏览器不支持流式响应。');
    var reader = res.body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buffer = '';
    var done = false;
    function handleLine(line) {
      if (line.charAt(line.length - 1) === '\r') line = line.slice(0, -1);
      if (!line || line.charAt(0) === ':') return;
      if (line.indexOf('data:') !== 0) return;
      var raw = line.slice(5).trim();
      if (!raw) return;
      if (raw === '[DONE]') { done = true; return; }
      var obj;
      try { obj = JSON.parse(raw); } catch (e) { return; }
      var choice = obj && obj.choices && obj.choices[0];
      var delta = choice && choice.delta;
      if (!delta) return;
      var changed = false;
      if (typeof delta.reasoning_content === 'string' && delta.reasoning_content) {
        assistant.reasoning += delta.reasoning_content;
        changed = true;
      }
      if (typeof delta.content === 'string' && delta.content) {
        assistant.content += delta.content;
        changed = true;
      }
      if (changed) scheduleRender();
    }
    while (!done) {
      var result = await reader.read();
      if (result.done) break;
      buffer += decoder.decode(result.value, { stream: true });
      var index;
      while ((index = buffer.indexOf('\n')) >= 0) {
        handleLine(buffer.slice(0, index));
        buffer = buffer.slice(index + 1);
        if (done) break;
      }
    }
    if (done) { try { await reader.cancel(); } catch (e) {} }
    else { buffer += decoder.decode(); if (buffer) handleLine(buffer); }
  }
  async function sendMessage(text, regenerate) {
    if (streaming) return;
    if (!settings.apiKey.trim()) { openSettings(); toast('请先在设置中填写 API Key'); return; }
    if (!isValidBase()) { openSettings(); toast('Base URL 格式不正确'); return; }
    var session = ensureSession();
    if (!regenerate) {
      if (!session.messages.length) session.title = sessionTitle(text);
      session.messages.push({ id: uid(), role: 'user', content: text, createdAt: Date.now() });
    }
    session.updatedAt = Date.now();
    var assistant = {
      id: uid(), role: 'assistant', content: '', reasoning: '',
      model: settings.model, createdAt: Date.now(), streaming: true, error: ''

    session.messages.push(assistant);

    renderDrawer();

      } else {
        assistant.error = friendlyError(err);
        toast(assistant.error, 'error');
      }

      assistant.streaming = false;
      delete assistant.streaming;
      if (token === streamToken) {
        streaming = false;
        controller = null;
        updateSendState();

      if (renderTimer !== null) { clearTimeout(renderTimer); renderTimer = null; }
      if (!assistant.content && !assistant.error && !assistant.reasoning) assistant.content = '（没有收到回复，请稍后重试）';

      if (!e.target.closest || !e.target.closest('.plus-wrap')) closePlusMenu();
    });
    els.plusMenu.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-menu]');
      if (!btn) return;
      var action = btn.getAttribute('data-menu');
      closePlusMenu();
      if (action === 'new') startNewChat();
      else if (action === 'clear') askClearCurrent();
      else if (action === 'settings') openSettings();
    });
    els.input.addEventListener('input', function () { autosize(); updateSendState(); });
    els.input.addEventListener('focus', function () {
      setTimeout(function () { updateViewport(); if (getSession()) scrollToBottom(true); }, 300);
    });
    els.sendBtn.addEventListener('click', onSend);
    els.suggestions.addEventListener('click', function (e) {
      var btn = e.target.closest('.suggest');
      if (!btn) return;
      els.input.value = btn.getAttribute('data-text') || '';
      autosize();
      updateSendState();
      els.input.focus();
    });
    var modelButtons = document.querySelectorAll('.model-chip, .model-option');
    for (var i = 0; i < modelButtons.length; i++) {
      modelButtons[i].addEventListener('click', function () {
        selectModel(this.getAttribute('data-model'));
      });
    }
    els.temp.addEventListener('input', function () {
      settings.temperature = Number(els.temp.value);
      els.tempValue.textContent = Number(settings.temperature).toFixed(1);
      save('settings', settings);
    });
    els.apiKey.addEventListener('input', function () { settings.apiKey = els.apiKey.value; persistSettings(); });
    els.baseUrl.addEventListener('input', function () { settings.baseURL = els.baseUrl.value; persistSettings(); });
    els.systemPrompt.addEventListener('input', function () { settings.systemPrompt = els.systemPrompt.value; save('settings', settings); });
    els.toggleKey.addEventListener('click', function () {
      var show = els.apiKey.type === 'password';
      els.apiKey.type = show ? 'text' : 'password';
      els.toggleKey.textContent = show ? '隐藏' : '显示';
      els.toggleKey.setAttribute('aria-label', show ? '隐藏 API Key' : '显示 API Key');
    });
    els.testBtn.addEventListener('click', testConnection);
    els.clearAll.addEventListener('click', clearAllSessions);
    els.historyList.addEventListener('click', function (e) {
      var item = e.target.closest('.history-item');
      if (!item) return;
      if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
      var id = item.getAttribute('data-session-id');
      if (e.target.closest('.history-more')) askDeleteSession(id);
      else openSession(id);
    });
    els.historyList.addEventListener('pointerdown', function (e) {
      var item = e.target.closest('.history-item');
      if (!item || e.target.closest('.history-more')) return;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(function () {
        suppressClick = true;
        askDeleteSession(item.getAttribute('data-session-id'));
      }, 550);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
      els.historyList.addEventListener(evt, function () { clearTimeout(pressTimer); });
    });
    els.historyList.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    els.messageList.addEventListener('click', function (e) {
      var thinkHead = e.target.closest('.think-head');
      if (thinkHead) {
        var box = thinkHead.closest('.think');
        var id = box.getAttribute('data-think-id');
        var willOpen = !box.classList.contains('open');
        box.classList.toggle('open', willOpen);
        thinkOpen[id] = willOpen;
        thinkHead.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        return;
      }
      var codeBtn = e.target.closest('[data-copy-code]');
      if (codeBtn) {
        var code = codeBtn.closest('.code-block').querySelector('code');
        copyText(code ? code.textContent : '');
        return;
      }
      var act = e.target.closest('[data-act]');
      if (!act) return;
      var article = act.closest('.msg');
      var msgId = article ? article.getAttribute('data-msg-id') : '';
      var session = getSession();
      var message = null;
      if (session) {
        for (var j = 0; j < session.messages.length; j++) {
          if (session.messages[j].id === msgId) { message = session.messages[j]; break; }
        }
      }
      if (!message) return;
      if (act.getAttribute('data-act') === 'copy') copyText(message.content);
      else if (act.getAttribute('data-act') === 'regen') regenerateLast();
    });
    els.chat.addEventListener('scroll', function () {
      autoScroll = els.chat.scrollHeight - els.chat.scrollTop - els.chat.clientHeight < 120;
    }, { passive: true });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (els.confirmOverlay.classList.contains('open')) closeConfirm();
      else if (els.settingsOverlay.classList.contains('open')) closeSettings();
      else if (els.drawer.classList.contains('open')) closeDrawer();
      else if (!els.plusMenu.hidden) closePlusMenu();
    });
    window.addEventListener('resize', updateViewport);
    window.addEventListener('orientationchange', function () { setTimeout(updateViewport, 250); });
    if (vv) {
      vv.addEventListener('resize', function () {
        updateViewport();
        if (document.activeElement === els.input) {
          clearTimeout(vvTimer);
          vvTimer = setTimeout(function () { if (getSession()) scrollToBottom(true); }, 100);
        }
      });
    }
  }
  // 启动
  function init() {
    updateViewport();
    applySettingsToUI();
    bindEvents();
    autosize();
    updateSendState();
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
